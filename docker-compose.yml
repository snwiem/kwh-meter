services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kwh
      POSTGRES_USER: kwh
      POSTGRES_PASSWORD: kwh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwh -d kwh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://kwh:kwh@db:5432/kwh
      KWH_METER_CONFIG: /config/meter.json
    volumes:
      # Mount the meter config file read-only; create meter-config.json
      # from meter-config.example.json and fill in your meter details.
      - ./meter-config.json:/config/meter.json:ro,z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
